name: PR Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: Splitzzyy/pr-reviewer/.github/workflows/review.yml@main
    with:
      review: true
      type: backend
    secrets: inherit
